<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>北千住デートラリー（試作）</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    /* 全体にやわらかいピンク～オレンジのグラデーション背景を敷く */
    body { 
        margin: 0; padding: 0; 
        font-family: "M PLUS Rounded 1c", sans-serif; 
        background: linear-gradient(180deg, #fff0f5 0%, #fff 100%); /* ほんのり桜色 */
        color: #555; 
        height: 100vh; /* グラデーションのために高さを確保 */
    }
    
    /* 地図：高さを少し調整 */
    #map { height: 60vh; width: 100%; z-index: 0; }

    /* ステータスバーの代わりに旗のスタイルを追加 */
    #gps-flag {
        position: absolute; top: 20px; left: 20px;
        width: 50px; height: 50px;
        background: #fff; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        z-index: 500; font-size: 24px; color: #ccc;
    }
    /* GPS取得中の色 */
    #gps-flag.active { 
        color: #ff0000;
        animation: pop 0.5s ease;
    }
    @keyframes pop { 50% { transform: scale(1.2); } }

    /* mission-boxに上の太線を追加 */
    .mission-box { 
        /* （既存のpaddingなどはそのままでOK） */
        border-top: 5px solid #ff9a9e; /* ←これを追加 */
    }

    /* ミッションボックス：上部にアクセントカラーを入れて「カード感」を強調 */
    .mission-box { 
        padding: 30px 25px; background: #fff; 
        position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
        width: 90%; max-width: 450px; box-sizing: border-box; 
        border-radius: 24px; 
        border-top: 5px solid #ff9a9e; /* ★ここがポイント！上のライン */
        box-shadow: 0 10px 40px rgba(0,0,0,0.1); 
        transition: bottom 0.3s; z-index: 1000; 
    }

    /* 見出し：サイズを大きくし、色を鮮やかに */
    h2 { margin: 0 0 10px; font-size: 20px; color: #ff6b81; letter-spacing: 0.05em; }
    
    /* 説明文：重要な数字（距離）を目立たせる */
    p { margin: 0 0 25px; font-size: 15px; color: #777; line-height: 1.6; }
    #dist-val { color: #ff9a9e; font-weight: bold; font-size: 1.2em; }

    /* ボタン：待機中もグレーにせず、薄いピンクで「可愛く待機」 */
    button { 
        width: 100%; padding: 18px; border: none; border-radius: 50px; 
        background: #ffe3e3; /* 待機色は薄いピンク */
        color: #ff8e8e; /* 文字は少し濃いピンク */
        font-size: 16px; font-weight: bold; 
        cursor: pointer; pointer-events: none; transition: all 0.3s ease; 
        font-family: inherit;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); /* 押し込まれてる感 */
    }
    
    /* ボタン有効時：鮮やかなグラデーションと影で「押して！」とアピール */
    button.active { 
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); 
        color: #fff; pointer-events: auto; 
        box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4); /* キラキラした影 */
        transform: translateY(-3px) scale(1.02); 
        box-shadow: none; /* insetを消す */
    }
    
    /* --- 以下、モーダル等は前回と同じですが、念のため維持 --- */
    #camera-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay-guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 60%; border: 3px dashed rgba(255,255,255,0.8); box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); pointer-events: none; border-radius: 20px; }
    .guide-text { position: absolute; top: 12%; width: 100%; text-align: center; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-size: 18px; z-index: 2001; letter-spacing: 0.1em; font-weight: bold; }
    #shutter-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; border-radius: 50%; background: white; border: 6px solid rgba(255,200,200,0.6); cursor: pointer; z-index: 2001; transition: transform 0.1s; }
    #shutter-btn:active { transform: translateX(-50%) scale(0.95); }
    #close-camera { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; z-index: 2001; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 50%; width: 40px; height: 40px; line-height: 40px; text-align: center; }

    /* スタンプ完了画面 */
    #stamp-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; box-sizing: border-box; }
    #stamp-modal h2 { color: #ff6b81; font-size: 26px; margin-bottom: 10px; }
    #stamp-modal img { max-width: 100%; max-height: 50vh; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 25px; border: 4px solid #fff; }
    .close-stamp-btn { margin-top: 10px; padding: 15px 50px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; box-shadow: 0 5px 15px rgba(255, 105, 180, 0.3); cursor: pointer; }
</style>
</head>
<body>

<div id="gps-flag">🏳️</div>
<div id="map"></div>

<div class="mission-box">
    <h2 id="mission-title">Spot A: 北千住駅西口</h2>
    <p id="mission-desc">まずは駅のデッキへ！ターゲットまであと <span id="dist-val">---</span> m</p>
    <button id="camera-btn">📸 エリア内でカメラ起動</button>
</div>

<div id="camera-modal">
    <div id="close-camera">✕</div>
    <div class="guide-text" id="guide-msg">足元を合わせて！</div>
    <video id="video" autoplay playsinline></video>
    <div class="overlay-guide"></div> <div id="shutter-btn"></div>
</div>

<div id="stamp-modal">
    <h2>🎉 STAMP GET!</h2>
    <img id="result-photo" src="" alt="Captured">
    <p>ナイスショット！写真はこの端末に保存されます。</p>
    <button class="close-stamp-btn" onclick="closeStamp()">次へ進む</button>
</div>

<script>
    // ★スポット定義
    const spots = [
        { id: 1, name: "Spot A: 駅西口デッキ", desc: "二人の靴を合わせて撮ろう", lat: 35.7498, lng: 139.8045, guide: "靴を枠に入れて！" },
        { id: 2, name: "Spot B: 宿場町通り", desc: "レトロな看板を指差して！", lat: 35.7510, lng: 139.8030, guide: "看板を枠に入れて！" },
        { id: 3, name: "Spot C: 荒川河川敷", desc: "空をバックに影を撮ろう", lat: 35.7550, lng: 139.8080, guide: "影を枠に入れて！" }
    ];

    let currentTarget = spots[0]; // 最初はAを選択状態に
    let userLat = 0, userLng = 0;

    // 地図初期化
    const map = L.map('map', { zoomControl: false }).setView([35.7494, 139.8051], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // ★青と赤のピン画像を用意する
    const blueIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], shadowSize: [41, 41]
    });
    const redIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41], iconAnchor: [12, 41], shadowSize: [41, 41]
    });

    const markers = []; // 全てのピンを管理する配列

    // ★スポットにピンを立てる部分を書き換え
    spots.forEach(spot => {
        // bindPopup を削除し、名前が出ないようにする。初期状態は青ピン。
        const marker = L.marker([spot.lat, spot.lng], { icon: blueIcon }).addTo(map);
        markers.push(marker);
        
        // ピンをクリックした時の動作
        marker.on('click', () => {
            // 一旦すべてのピンを青色に戻す
            markers.forEach(m => m.setIcon(blueIcon));
            // クリックされたピンだけ赤色にする
            marker.setIcon(redIcon);

            currentTarget = spot; 
            updateMissionDisplay();
            checkDistance();
        });
    });

    // 初期表示の更新
    updateMissionDisplay();

    function updateMissionDisplay() {
        document.getElementById('mission-title').innerText = currentTarget.name;
        document.getElementById('mission-desc').innerHTML = `${currentTarget.desc}<br>目的地まであと <span id="dist-val" style="color:#ff9a9e;font-weight:bold;">---</span> m`;
    }

    // ★GPS監視（旗の色変え機能つき）
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition((position) => {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            
            // 旗をピンクにする
            document.getElementById('gps-flag').classList.add('active');
            
            // 現在地マーカー
            if(window.userMarker) map.removeLayer(window.userMarker);
            window.userMarker = L.circleMarker([userLat, userLng], {
                color: '#fff', fillColor: '#2196F3', fillOpacity: 1, radius: 8, weight: 3
            }).addTo(map);

            checkDistance();

        }, (err) => {
            // 旗をグレーに戻す
            document.getElementById('gps-flag').classList.remove('active');
        }, { enableHighAccuracy: true });
    }

    // 距離計算とボタン制御
    function checkDistance() {
        if (!userLat || !userLng) return;

        // ★選んでいるターゲット（currentTarget）との距離を計算
        const dist = getDistance(userLat, userLng, currentTarget.lat, currentTarget.lng);
        const distElem = document.getElementById('dist-val');
        if(distElem) distElem.innerText = Math.round(dist);

        const btn = document.getElementById('camera-btn');
        if (dist < 50) { 
            btn.classList.add('active');
            btn.innerText = "📸 ここで撮影する！";
            btn.onclick = () => openCamera(currentTarget.guide);
        } else {
            btn.classList.remove('active');
            btn.innerText = `エリアまであと ${Math.round(dist)}m`;
            btn.onclick = null;
        }
    }
    
    // カメラ機能（ブラウザ完結）
    const video = document.getElementById('video');
    
    function openCamera(guideMsg) {
        document.getElementById('camera-modal').style.display = 'block';
        document.getElementById('guide-msg').innerText = guideMsg;
        
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("カメラの許可が必要です"));
    }

    document.getElementById('close-camera').onclick = () => {
        document.getElementById('camera-modal').style.display = 'none';
        const stream = video.srcObject;
        if(stream) stream.getTracks().forEach(track => track.stop());
    };

    // シャッターボタン（擬似的に画像をキャプチャ）
    document.getElementById('shutter-btn').onclick = () => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        // 画像を生成（本来はここでスマホにDLさせたりする）
        const imgUrl = canvas.toDataURL('image/png');
        document.getElementById('result-photo').src = imgUrl;
        
        document.getElementById('camera-modal').style.display = 'none';
        document.getElementById('stamp-modal').style.display = 'flex';
        
        // 次のスポットへ
        checkDistance();
    };

    function closeStamp() {
        document.getElementById('stamp-modal').style.display = 'none';
    }

    // 2点間の距離計算 (Haversine formula)
    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // 地球の半径 (m)
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
</script>
</body>
</html>
