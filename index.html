<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>北千住デートラリー（試作）</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    /* 全体のフォントを丸ゴシックに変更し、背景を温かみのある色に */
    body { margin: 0; padding: 0; font-family: "M PLUS Rounded 1c", sans-serif; background: #fffaf5; color: #555; }
    
    /* マップの高さ調整（少し広めに） */
    #map { height: 65vh; width: 100%; z-index: 0; }

    /* ステータスバー：上部に浮いた白いカプセル型に変更 */
    .status-bar { 
        position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
        width: 85%; max-width: 400px; padding: 12px 20px; 
        background: rgba(255, 255, 255, 0.95); border-radius: 30px; 
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        text-align: center; font-weight: bold; color: #555; 
        z-index: 500; backdrop-filter: blur(4px); font-size: 14px;
    }

    /* ミッションボックス：画面下部に浮いたカード型に変更 */
    .mission-box { 
        padding: 25px; background: #fff; 
        position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); 
        width: 92%; max-width: 500px; box-sizing: border-box; 
        border-radius: 24px; 
        box-shadow: 0 8px 30px rgba(0,0,0,0.12); 
        transition: bottom 0.3s; z-index: 1000; 
    }

    /* テキストスタイル：色を柔らかく調整 */
    h2 { margin: 0 0 8px; font-size: 18px; color: #ff8e8e; /* サーモンピンク */ letter-spacing: 0.05em; }
    p { margin: 0 0 20px; font-size: 14px; color: #777; line-height: 1.6; }

    /* ボタン：グラデーションと角丸で「押したくなる」デザインに */
    button { 
        width: 100%; padding: 16px; border: none; border-radius: 50px; 
        background: #f0f0f0; color: #aaa; font-size: 16px; font-weight: bold; 
        cursor: pointer; pointer-events: none; transition: all 0.3s ease; 
        font-family: inherit;
    }
    button.active { 
        background: linear-gradient(135deg, #ff9a9e 0%, #ffc3a0 100%); /* 優しいグラデーション */
        color: #fff; pointer-events: auto; 
        box-shadow: 0 6px 20px rgba(255, 154, 158, 0.4); 
        transform: translateY(-2px); 
    }
    
    /* --- モーダル等のスタイル（機能維持のため微調整のみ） --- */
    #camera-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay-guide { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 60%; border: 2px dashed rgba(255,255,255,0.7); box-shadow: 0 0 0 9999px rgba(0,0,0,0.5); pointer-events: none; border-radius: 10px; }
    .guide-text { position: absolute; top: 12%; width: 100%; text-align: center; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-size: 18px; z-index: 2001; letter-spacing: 0.1em; }
    #shutter-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 72px; height: 72px; border-radius: 50%; background: white; border: 6px solid rgba(255,255,255,0.4); cursor: pointer; z-index: 2001; transition: transform 0.1s; }
    #shutter-btn:active { transform: translateX(-50%) scale(0.9); }
    #close-camera { position: absolute; top: 20px; right: 20px; color: white; font-size: 28px; cursor: pointer; z-index: 2001; padding: 10px; }

    /* スタンプ完了画面 */
    #stamp-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.98); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; box-sizing: border-box; }
    #stamp-modal h2 { color: #ff8e8e; font-size: 24px; margin-bottom: 20px; }
    #stamp-modal img { max-width: 100%; max-height: 50vh; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .close-stamp-btn { margin-top: 10px; padding: 15px 40px; background: #555; color: white; border: none; border-radius: 30px; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<div class="status-bar">現在地: <span id="gps-status">取得中...</span></div>
<div id="map"></div>

<div class="mission-box">
    <h2 id="mission-title">Spot A: 北千住駅西口</h2>
    <p id="mission-desc">まずは駅のデッキへ！ターゲットまであと <span id="dist-val">---</span> m</p>
    <button id="camera-btn">📸 エリア内でカメラ起動</button>
</div>

<div id="camera-modal">
    <div id="close-camera">✕</div>
    <div class="guide-text" id="guide-msg">足元を合わせて！</div>
    <video id="video" autoplay playsinline></video>
    <div class="overlay-guide"></div> <div id="shutter-btn"></div>
</div>

<div id="stamp-modal">
    <h2>🎉 STAMP GET!</h2>
    <img id="result-photo" src="" alt="Captured">
    <p>ナイスショット！写真はこの端末に保存されます。</p>
    <button class="close-stamp-btn" onclick="closeStamp()">次へ進む</button>
</div>

<script>
    // 北千住のスポット定義 (緯度, 経度)
    const spots = [
        { id: 1, name: "Spot A: 駅西口デッキ", desc: "二人の靴を合わせて撮ろう", lat: 35.7498, lng: 139.8045, guide: "靴を枠に入れて！" },
        { id: 2, name: "Spot B: 宿場町通り", desc: "レトロな看板を指差して！", lat: 35.7510, lng: 139.8030, guide: "看板を枠に入れて！" },
        { id: 3, name: "Spot C: 荒川河川敷", desc: "空をバックに影を撮ろう", lat: 35.7550, lng: 139.8080, guide: "影を枠に入れて！" }
    ];

    let currentSpotIndex = 0;
    let userLat = 0, userLng = 0;

    // 地図の初期化（北千住中心）
    const map = L.map('map').setView([35.7494, 139.8051], 15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // スポットにピンを立てる
    const markers = [];
    spots.forEach((spot, index) => {
        const marker = L.marker([spot.lat, spot.lng]).addTo(map).bindPopup(spot.name);
        markers.push(marker);
    });

    // GPS取得開始
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition((position) => {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            document.getElementById('gps-status').innerText = "取得OK";
            
            // 現在地マーカー（青丸）
            if(window.userMarker) map.removeLayer(window.userMarker);
            window.userMarker = L.circleMarker([userLat, userLng], {color: 'blue', radius: 8}).addTo(map);

            checkDistance();
        }, (err) => {
            document.getElementById('gps-status').innerText = "GPS許可が必要です";
            alert("位置情報の許可をONにしてください！");
        });
    }

    // 距離判定ロジック
    function checkDistance() {
        if(currentSpotIndex >= spots.length) {
            document.getElementById('mission-title').innerText = "コンプリート！";
            document.getElementById('mission-desc').innerText = "おめでとうございます！デート楽しんでね！";
            return;
        }

        const target = spots[currentSpotIndex];
        const dist = getDistance(userLat, userLng, target.lat, target.lng); // メートル計算
        
        document.getElementById('mission-title').innerText = target.name;
        document.getElementById('dist-val').innerText = Math.round(dist);
        document.getElementById('mission-desc').innerText = target.desc + ` (あと ${Math.round(dist)}m)`;

        const btn = document.getElementById('camera-btn');
        // 50m以内ならボタン有効化 (テスト用に30mにしてます。本番は50に。)
        if (dist < 30) { 
            btn.classList.add('active');
            btn.innerText = "📸 カメラを起動する";
            btn.onclick = () => openCamera(target.guide);
        } else {
            btn.classList.remove('active');
            btn.innerText = `エリアまであと ${Math.round(dist)}m`;
            btn.onclick = null;
        }
    }

    // カメラ機能（ブラウザ完結）
    const video = document.getElementById('video');
    
    function openCamera(guideMsg) {
        document.getElementById('camera-modal').style.display = 'block';
        document.getElementById('guide-msg').innerText = guideMsg;
        
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("カメラの許可が必要です"));
    }

    document.getElementById('close-camera').onclick = () => {
        document.getElementById('camera-modal').style.display = 'none';
        const stream = video.srcObject;
        if(stream) stream.getTracks().forEach(track => track.stop());
    };

    // シャッターボタン（擬似的に画像をキャプチャ）
    document.getElementById('shutter-btn').onclick = () => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        // 画像を生成（本来はここでスマホにDLさせたりする）
        const imgUrl = canvas.toDataURL('image/png');
        document.getElementById('result-photo').src = imgUrl;
        
        document.getElementById('camera-modal').style.display = 'none';
        document.getElementById('stamp-modal').style.display = 'flex';
        
        // 次のスポットへ
        currentSpotIndex++;
        checkDistance();
    };

    function closeStamp() {
        document.getElementById('stamp-modal').style.display = 'none';
    }

    // 2点間の距離計算 (Haversine formula)
    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // 地球の半径 (m)
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
</script>
</body>
</html>
